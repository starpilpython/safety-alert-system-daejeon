<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent App</title>

    <script type="module" src="./main.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>

  </head>

  <body>
    <header>
      <img id="logo" src="/assets/brand.png"  class="logo tauri" alt="Tauri logo" />
      <span>취약계층 AI 돌봄 위험 탐지 프로그램</span>
      <span id="clock"></span>
    </header>   
    <main>
      <div class="container">
        <!-- 상단 발화 텍스트 데이터 입력 입력 -->
        <div class="header">
          <span class="title">🔻AI Agent 세팅</span>
          <nav class="menu"> <!-- 메뉴바 생성  -->
            <div class="card">
              <span>Step1. 파일을 업로드 해주세요</span>
              <button id="open-file-btn">업로드</button>
              <span class="header_result" id="result-path">미완료</span>
            </div>
            <div class="card">
              <span>Step2. 사용자 ID 숫자로 입력</span>
              <input id="input" type="number" placeholder="사용자 ID(정수)">
              <button id="input_id">입력</button>
              <span class="header_result" id="input-path">미완료</span>
            </div>
            <div class="card">
              <span>Step3. AI 분석 실행</span>
              <button class="none hidden" id="exe" >분석실행</button>
              <span class="header_result hidden" id="exe-path" >미완료</span>
            </div>

          </nav> 
        </div>

        <!-- 결과  -->
        <div class="middle">
          <span class="title">🔻AI Agent 실행</span>
          <div class="result-view" id="table-wrapper">
          </div>
          <div>
            <button id="kakao">보호자에게 알림 전송 (자동화 가능)</button>
          </div>
        </div>

      </div>    
      
    </main>
  </body>
